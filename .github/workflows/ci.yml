# CI: runs on every pull request and on every push to main.
# It answers one question: "is this change safe to merge?" (lint + format + tests).
# Docs: https://docs.github.com/en/actions

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

# If you push again while a run is in progress on the same branch, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      # Download the repository into the runner.
      - name: Check out the code
        uses: actions/checkout@v7

      # Install uv. It also installs the Python version from .python-version when needed.
      # setup-uv publishes full version tags only (no floating "v10"), so the tag is exact.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      # Create the virtual environment and install the project plus the dev tools.
      # After uv.lock is committed (issue #2), issue #3 changes this to `uv sync --locked`,
      # which fails when the lockfile and pyproject.toml disagree.
      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest
