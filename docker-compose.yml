# docker-compose.yml: the services this project needs on your machine.
#
# One command starts everything:   docker compose up -d
# See what is running:             docker compose ps
# Follow the logs:                 docker compose logs -f postgres
# Stop (data is kept):             docker compose down
# Stop AND delete the data:        docker compose down -v
#
# The API itself is not here yet. It runs on your machine with `uv run fastapi dev ...`.
# Adding it as a third service (with a Dockerfile) is a Milestone 1 issue.
#
# Reference: https://docs.docker.com/reference/compose-file/

# Project name. Compose uses it as a prefix for containers, the network and volumes,
# for example "narrative-engine-postgres-1". Without it, the folder name is used.
name: narrative-engine

# A service is one container definition. The service name ("postgres", "redis") is also
# its hostname inside the Compose network, so other containers reach it by that name.
services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: the system of record (characters, world state, inventory).
  # ---------------------------------------------------------------------------
  postgres:
    # Official image, major version 18, Alpine variant (smaller download).
    # Pinning the major version means "docker compose pull" never jumps to 19 by surprise.
    image: postgres:18-alpine

    # Restart the container if it crashes or Docker restarts, unless you stopped it yourself.
    restart: unless-stopped

    # Variables passed INTO the container. The image reads these three on the first
    # start only, to create the user and the database.
    # ${NAME:-default} = value from .env, or the default when it is missing.
    # ${NAME:?message} = value from .env, or stop with this message when it is missing.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-narrative}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-narrative_engine}

    # "host:container". The left side is your machine, the right side is the container.
    # 127.0.0.1 publishes the port only to your own machine, not to your network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    # A named volume keeps the database files when the container is removed.
    # From PostgreSQL 18 on, the official image expects the volume at /var/lib/postgresql
    # (older tutorials use /var/lib/postgresql/data; that path is for 17 and below).
    volumes:
      - postgres_data:/var/lib/postgresql

    # Docker runs this command inside the container to know when the database is ready.
    # "docker compose ps" then shows "healthy". Other services can wait for it.
    # $$ is an escaped $: the variable is read inside the container, not by Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s      # how often to check
      timeout: 3s       # how long one check may take
      retries: 10       # failures in a row before "unhealthy"
      start_period: 10s # grace time for the first start (database initialization)

  # ---------------------------------------------------------------------------
  # Redis: fast in-memory store. Nothing uses it yet. It is here so the stack is
  # ready when a milestone needs a cache (LLM responses) or rate limiting.
  # ---------------------------------------------------------------------------
  redis:
    # Official image, major version 8, Alpine variant.
    image: redis:8-alpine

    restart: unless-stopped

    # Replaces the image's default command to add two options:
    # --save 60 1         write a snapshot to disk every 60 s if at least 1 key changed
    # --loglevel warning  log only what matters
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

    # Redis writes its snapshot to /data. The named volume keeps it between restarts.
    volumes:
      - redis_data:/data

    # "redis-cli ping" answers PONG when Redis is ready.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Named volumes are managed by Docker (list them with "docker volume ls").
# They survive "docker compose down". Only "docker compose down -v" deletes them.
volumes:
  postgres_data:
  redis_data:
